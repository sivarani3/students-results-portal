services:
  - type: web
    name: students-results-portal
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn results_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: students-results-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: students-results-db
    plan: free
