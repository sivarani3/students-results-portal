services:
  - type: web
    name: students-results-portal
    plan: free
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn results_portal.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: students-results-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: students-results-db
    plan: free
